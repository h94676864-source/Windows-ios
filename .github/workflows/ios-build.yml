name: iOS Device Build (Unsigned IPA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue builds instead of cancelling an active build when another commit arrives.
concurrency:
  group: ios-device-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated project
        run: xcodebuild -list -project WinlatorIOS.xcodeproj

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild \
            -project WinlatorIOS.xcodeproj \
            -scheme WinlatorIOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DeviceData/Build/Products/Release-iphoneos/WinlatorIOS.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          ditto "$APP_PATH" Payload/WinlatorIOS.app
          ditto -c -k --sequesterRsrc --keepParent Payload WinlatorIOS-Unsigned.ipa
          test -s WinlatorIOS-Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorIOS-Unsigned-IPA
          path: WinlatorIOS-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
