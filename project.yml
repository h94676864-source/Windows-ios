name: WinlatorIOS
options:
  bundleIdPrefix: com.winlator
  deploymentTarget:
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.5"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Winlator
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  WinlatorIOS:
    type: application
    platform: iOS
    sources:
      - path: apps/iOS/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winlator.ios
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Local network access may be used to connect to a desktop host on your network.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    scheme:
      testTargets: []
